name: release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z
        required: true
      commit:
        description: Full SHA of the commit on master to release
        required: true
      notes:
        description: Release notes
        required: false

permissions:
  contents: write
  packages: write

concurrency: release

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ inputs.version || github.event.pull_request.head.ref }}
      COMMIT: ${{ inputs.commit || github.event.pull_request.merge_commit_sha }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0

      - name: Check the version and the commit
        id: check
        run: |
          version=${RELEASE#release/}
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              || { echo "::error::$version is not X.Y.Z"; exit 1; }
          ! git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null \
              || { echo "::error::v$version is already released"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/master \
              || { echo "::error::$COMMIT is not on master"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  image:
    needs: check
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.COMMIT }}

      - name: Build the image
        run: |
          docker build \
              --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.version="$VERSION" \
              --label org.opencontainers.image.revision="$COMMIT" \
              --tag "matrix-for-ai:${{ matrix.architecture }}" .
          test "$(docker image inspect --format '{{.Architecture}}' "matrix-for-ai:${{ matrix.architecture }}")" \
              = "${{ matrix.architecture }}"
          docker save --output "$RUNNER_TEMP/image-${{ matrix.architecture }}.tar" \
              "matrix-for-ai:${{ matrix.architecture }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image-${{ matrix.architecture }}.tar
          retention-days: 1

  publish:
    needs: [check, image]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ needs.check.outputs.commit }}
      NOTES: ${{ inputs.notes || github.event.pull_request.body }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Push the image
        run: |
          major=${VERSION%%.*} minor=${VERSION%.*}
          podman manifest create matrix-for-ai
          for architecture in amd64 arm64; do
              podman manifest add matrix-for-ai "docker-archive:$RUNNER_TEMP/images/image-$architecture.tar"
          done
          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          podman manifest push --all --digestfile "$RUNNER_TEMP/digest" matrix-for-ai "docker://$IMAGE:$VERSION"
          digest=$(cat "$RUNNER_TEMP/digest")
          for tag in "$minor" "$major" latest; do
              skopeo copy --all --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:$tag"
          done
          for tag in "$VERSION" "$minor" "$major" latest; do
              test "$(skopeo inspect --raw "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)" = "${digest#sha256:}"
          done
          test "$(skopeo inspect --raw "docker://$IMAGE@$digest" \
              | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(" ")')" \
              = "linux/amd64 linux/arm64"
          echo "$IMAGE:$VERSION@$digest" >"$RUNNER_TEMP/image"

      - name: Create the release
        run: |
          {
              [[ -z $NOTES ]] || printf '%s\n\n' "$NOTES"
              echo "Image: \`$(cat "$RUNNER_TEMP/image")\` (linux/amd64, linux/arm64)"
          } >"$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$COMMIT" --title "$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
